<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队知识库 & 任务备忘</title>

<!-- ============================================================
     【共享版说明 - 配置完成后，所有人都可访问同一个网址】
     ------------------------------------------------------------
     原理：把原本只在 localStorage 中的数据搬到 Firebase Realtime
     Database（Google 免费云数据库），所有人读写同一份数据。
     任何添加 / 编辑 / 删除，所有人的页面会自动实时刷新。

     ★ 部署步骤（仅需一次，之后所有人即可访问）：

     ① 创建 Firebase 项目
        - 打开 https://console.firebase.google.com/
        - 点 "添加项目 / Add project"，按提示完成

     ② 启用 Realtime Database
        - 左侧菜单 → 构建 → Realtime Database
        - 点 "创建数据库"，选位置（推荐 asia-southeast1 较近）
        - 安全模式选 "Start in test mode"

     ③ 设置数据库规则（关键！允许公开读写）
        - 切到 "Rules" 标签，替换为：
            {
              "rules": {
                ".read":  true,
                ".write": true
              }
            }
        - 点 "Publish" 发布
        - ⚠ 生产环境请配合 Firebase Auth 做权限控制

     ④ 获取 Web 配置
        - 点齿轮 ⚙ → 项目设置 → 您的应用 → 点</> 注册 Web 应用
        - 复制 firebaseConfig 对象内容

     ⑤ 替换下方常量 firebaseConfig

     ⑥ 部署到任意静态托管 - Firebase Hosting: firebase deploy --only hosting
        - Vercel / Netlify / Cloudflare Pages: 拖入 index.html 即可
        - GitHub Pages: 提交到仓库即可

     完成后把网址发给队友即可共享。
     ============================================================ -->

<!-- Firebase JS SDK（兼容模式，无需 npm/构建工具） -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
  /* ===== 基础排版 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #f6f7fb;
    color: #1a1d2e;
    line-height: 1.6;
    padding: 1.5rem 1rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .sub { color: #6b7185; font-size: 0.85rem; margin-bottom: 1.25rem; }

  /* ===== 顶部标签栏 ===== */
  .tabs {
    display: flex; gap: 0.4rem;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.3rem;
    margin-bottom: 1.25rem;
  }
  .tab {
    flex: 1;
    padding: 0.55rem 0.75rem;
    border: none; background: transparent;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.92rem;
    color: #6b7185;
    cursor: pointer;
    font-weight: 500;
  }
  .tab.active { background: #6366f1; color: #fff; }

  /* ===== 添加表单 ===== */
  .add {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.85rem;
    margin-bottom: 1rem;
  }
  .add input, .add textarea {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.92rem;
    font-family: inherit;
    outline: none;
    margin-bottom: 0.5rem;
  }
  .add input:focus, .add textarea:focus { border-color: #6366f1; }
  .add textarea { resize: vertical; min-height: 80px; }
  .add .meta {
    display: flex; gap: 0.5rem;
    align-items: center; flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }
  .add .meta input { margin: 0; flex: 1; min-width: 120px; }
  .add .btnrow { display: flex; justify-content: flex-end; gap: 0.4rem; }
  .btn {
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.45rem 1rem;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #4f46e5; }
  .btn-ghost { background: transparent; color: #6b7185; border: 1px solid #e5e7eb; }
  .btn-ghost:hover { background: #f3f4f6; color: #1a1d2e; }

  /* ===== 任务条目 ===== */
  .item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    margin-bottom: 0.5rem;
    display: flex; align-items: flex-start; gap: 0.65rem;
  }
  .item.done .t-text { text-decoration: line-through; color: #9ca3af; }
  .item input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #6366f1;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .t-body { flex: 1; }
  .t-text { font-size: 0.95rem; word-break: break-word; }
  .t-meta { font-size: 0.78rem; color: #6b7185; margin-top: 0.2rem; }
  .t-meta .tag {
    background: #eef2ff; color: #4f46e5;
    padding: 0.05rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.35rem;
  }
  .t-actions { display: flex; gap: 0.25rem; }
  .t-actions button {
    background: transparent; border: none;
    color: #9ca3af; cursor: pointer;
    font-size: 1rem; padding: 0 0.2rem;
  }
  .t-actions .del:hover  { color: #ef4444; }
  .t-actions .edit:hover { color: #6366f1; }

  /* ===== 信息共享卡片 ===== */
  .doc {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.7rem;
  }
  .doc h3 {
    font-size: 1rem;
    margin-bottom: 0.45rem;
    color: #1a1d2e;
    word-break: break-word;
  }
  .doc .body {
    font-size: 0.9rem; color: #4b5563;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 0.5rem;
  }
  .doc .actions {
    display: flex; gap: 0.4rem;
    justify-content: flex-end;
    border-top: 1px dashed #e5e7eb;
    padding-top: 0.5rem;
    margin-top: 0.5rem;
  }
  .doc .actions button {
    background: transparent;
    border: 1px solid #e5e7eb;
    border-radius: 5px;
    padding: 0.25rem 0.7rem;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
    color: #6b7185;
  }
  .doc .actions .save:hover { color: #6366f1; border-color: #6366f1; }
  .doc .actions .del:hover  { color: #ef4444; border-color: #ef4444; }

  .empty { text-align: center; color: #9ca3af; padding: 2rem 0; font-size: 0.9rem; }

  /* ===== 新增：实时连接状态徽标 ===== */
  .status {
    position: fixed;
    top: 0.6rem; right: 0.6rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.72rem;
    background: #fef3c7; color: #92400e;
    border: 1px solid #fde68a;
    z-index: 99;
  }
  .status.online { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
  .status.error { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
</style>
</head>
<body>
  <!-- 右上角连接状态指示 -->
  <div id="status" class="status">连接中…</div>

  <div class="wrap">
    <h1>团队知识库 & 任务备忘</h1>
    <div class="sub">实时共享：所有访问者看到的内容会自动同步</div>

    <div class="tabs">
      <button class="tab active" data-tab="task" onclick="switchTab('task')">📋 任务备忘</button>
      <button class="tab" data-tab="doc"  onclick="switchTab('doc')">📚 信息共享</button>
    </div>

    <!-- 任务面板 -->
    <div id="panel-task">
      <div class="add">
        <div class="meta">
          <input type="text" id="tText" placeholder="任务内容…" onkeydown="if(event.key==='Enter')addTask()">
          <input type="text" id="tWho"  placeholder="负责人（可选）" style="max-width:140px">
        </div>
        <div class="btnrow">
          <button class="btn" onclick="addTask()">+ 添加任务</button>
        </div>
      </div>
      <div id="taskList"></div>
    </div>

    <!-- 信息共享面板 -->
    <div id="panel-doc" style="display:none">
      <div class="add">
        <input type="text" id="dTitle" placeholder="标题，如：实验操作流程">
        <textarea id="dBody" placeholder="详细内容，支持换行…"></textarea>
        <div class="btnrow">
          <button class="btn" onclick="addDoc()">+ 发布信息</button>
        </div>
      </div>
      <div id="docList"></div>
    </div>
  </div>

<script>
/* ================================================================
 *  Firebase 项目配置
 *  取得方式：Firebase 控制台 → 项目设置 → 您的应用 → SDK 设置
 * ================================================================ */
const firebaseConfig = {
  apiKey:            "AIzaSyDummyReplaceMeWithYourOwnKey",
  authDomain:        "your-project.firebaseapp.com",
  databaseURL:       "https://your-project-default-rtdb.firebaseio.com",
  projectId:         "your-project",
  storageBucket:     "your-project.appspot.com",
  messagingSenderId: "000000000000",
  appId:             "1:000000000000:web:0000000000000000000000"
};

/* ================================================================
 *  防止用户没改配置就部署：在页面上明确提示
 * ================================================================ */
if (firebaseConfig.apiKey.includes('Dummy') || firebaseConfig.apiKey.includes('ReplaceMe')) {
  document.getElementById('status').textContent = '⚠ 请先配置 Firebase';
  document.getElementById('status').classList.add('error');
  // 仍然继续执行，让用户能看到清晰的错误
}

/* ================================================================
 *  初始化 Firebase 与数据库引用
 *  ----------------------------------------------------------------
 *  - initializeApp(firebaseConfig)  根据配置连接云端
 *  - database()                     拿到实时数据库实例
 *  - ref('tasks') / ref('docs')      创建数据节点引用，所有 CRUD 都走它
 * ================================================================ */
firebase.initializeApp(firebaseConfig);
const db        = firebase.database();
const tasksRef  = db.ref('tasks');   // 顶层节点 'tasks'
const docsRef   = db.ref('docs');    // 顶层节点 'docs'

/* ================================================================
 *  实时连接状态监听
 *  ----------------------------------------------------------------
 *  .info/connected 是 Firebase 的特殊节点：
 *    true ⇄ WebSocket 已建立（在线）
 *    false ⇄ 断开（离线）
 *  用于显示右上角"在线/离线"徽标，让用户知道是否在实时同步。
 * ================================================================ */
const connEl = document.getElementById('status');
firebase.database().ref('.info/connected').on('value', (snap) => {
  if (snap.val() === true) {
    connEl.textContent = '● 已连接（实时同步）';
    connEl.classList.add('online');
    connEl.classList.remove('error');
  } else {
    connEl.textContent = '○ 离线（恢复后将自动同步）';
    connEl.classList.remove('online');
  }
});

/* ================================================================
 *  本地缓存：由 on('value') 实时从云端同步而来
 * ================================================================ */
let tasks = [];
let docs  = [];

/* ================================================================
 *  实时数据订阅 —— 实现"共享"的核心
 *  ----------------------------------------------------------------
 *  ref.on('value', cb) 会：
 *    1) 立即触发一次，回传当前最新数据
 *    2) 之后任意人修改云端数据，所有客户端的 cb 都会被触发
 *  因此只要数据在云端变化，所有人的页面会自动刷新。
 * ================================================================ */
tasksRef.on('value', (snapshot) => {
  // Firebase 把列表存为 {autoId1: obj1, autoId2: obj2}
  // 这里把对象转成带 _key 的数组，便于按数组方式渲染与排序
  const data = snapshot.val() || {};
  tasks = Object.keys(data).map(k => ({ ...data[k], _key: k }));
  tasks.sort((a, b) => (b.ts || 0) - (a.ts || 0)); // 最新置顶
  renderTasks();
}, (err) => {
  console.error('任务同步失败：', err);
  alert('任务数据同步出错：' + err.message);
});

docsRef.on('value', (snapshot) => {
  const data = snapshot.val() || {};
  docs = Object.keys(data).map(k => ({ ...data[k], _key: k }));
  docs.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  renderDocs();
}, (err) => {
  console.error('文档同步失败：', err);
});

/* ================================================================
 *  首次进入时插入示例文档（仅当云端无任何数据时执行一次）
 * ================================================================ */
docsRef.once('value', (snapshot) => {
  if (!snapshot.exists()) {
    docsRef.push({
      title: '示例：实验操作标准流程',
      body:  '1. 样品前处理\n2. 试剂配制（A:B = 1:3）\n3. 上机测量并记录\n4. 数据归档至共享盘 /lab/yyyy-mm-dd\n\n注意事项：佩戴手套，避免交叉污染。',
      // ServerValue.TIMESTAMP 由服务器生成时间戳，所有人时间一致
      ts:    firebase.database.ServerValue.TIMESTAMP
    });
  }
});

/* ================================================================
 *  标签切换
 * ================================================================ */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.getElementById('panel-task').style.display = name === 'task' ? '' : 'none';
  document.getElementById('panel-doc').style.display  = name === 'doc'  ? '' : 'none';
}

/* ================================================================
 *  任务 CRUD（写入云端；UI 由 tasksRef.on('value') 自动刷新）
 * ================================================================ */
function addTask() {
  const tEl = document.getElementById('tText');
  const wEl = document.getElementById('tWho');
  const text = tEl.value.trim();
  if (!text) return;
  // push() 自动生成唯一 key（如 -NxYz...），所有客户端实时收到
  tasksRef.push({
    text,
    who:  wEl.value.trim(),
    done: false,
    ts:   firebase.database.ServerValue.TIMESTAMP
  });
  tEl.value = ''; wEl.value = '';
}

function toggleTask(key) {
  const task = tasks.find(t => t._key === key);
  if (!task) return;
  // update() 只改 done 字段，其他字段保留
  tasksRef.child(key).update({ done: !task.done });
}

function delTask(key) {
  if (!confirm('确定删除此任务吗？')) return;
  tasksRef.child(key).remove(); // 云端删除，所有客户端同步消失
}

function editTask(key) {
  const task = tasks.find(t => t._key === key);
  if (!task) return;
  const nv = prompt('修改任务内容：', task.text);
  if (nv !== null && nv.trim()) {
    tasksRef.child(key).update({
      text: nv.trim(),
      ts:   firebase.database.ServerValue.TIMESTAMP  // 更新后自动置顶
    });
  }
}

function renderTasks() {
  const el = document.getElementById('taskList');
  if (!tasks.length) {
    el.innerHTML = '<div class="empty">还没有任务，在上面添加一条吧</div>';
    return;
  }
  el.innerHTML = tasks.map(t => `
    <div class="item ${t.done ? 'done' : ''}">
      <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask('${t._key}')">
      <div class="t-body">
        <div class="t-text">${esc(t.text)}</div>
        ${t.who ? `<div class="t-meta"><span class="tag">@${esc(t.who)}</span></div>` : ''}
      </div>
      <div class="t-actions">
        <button class="edit" onclick="editTask('${t._key}')" title="编辑">✎</button>
        <button class="del"  onclick="delTask('${t._key}')"  title="删除">×</button>
      </div>
    </div>
  `).join('');
}

/* ================================================================
 *  信息共享 CRUD
 * ================================================================ */
function addDoc() {
  const tEl = document.getElementById('dTitle');
  const bEl = document.getElementById('dBody');
  const title = tEl.value.trim();
  const body  = bEl.value.trim();
  if (!title || !body) { alert('请填写标题和内容'); return; }
  docsRef.push({
    title,
    body,
    ts: firebase.database.ServerValue.TIMESTAMP
  });
  tEl.value = ''; bEl.value = '';
}

function delDoc(key) {
  if (!confirm('确定删除这条信息吗？')) return;
  docsRef.child(key).remove();
}

function editDoc(key) {
  const d = docs.find(x => x._key === key);
  if (!d) return;
  const card = document.querySelector('[data-id="' + key + '"]');
  if (!card) return;
  // 把卡片替换为可编辑控件（就地编辑）
  card.innerHTML = `
    <input type="text" id="ed-t-${key}" value="${esc(d.title)}"
      style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:0.45rem 0.65rem;font-size:0.95rem;font-family:inherit;margin-bottom:0.4rem">
    <textarea id="ed-b-${key}"
      style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:0.45rem 0.65rem;font-size:0.9rem;font-family:inherit;min-height:120px;resize:vertical">${esc(d.body)}</textarea>
    <div class="actions">
      <button class="save" onclick="saveDoc('${key}')">保存</button>
      <button class="del"  onclick="renderDocs()">取消</button>
    </div>
  `;
}

function saveDoc(key) {
  const t = document.getElementById('ed-t-' + key).value.trim();
  const b = document.getElementById('ed-b-' + key).value.trim();
  if (!t || !b) { alert('标题和内容不能为空'); return; }
  docsRef.child(key).update({
    title: t,
    body:  b,
    ts:    firebase.database.ServerValue.TIMESTAMP
  });
  // UI 刷新交给 docsRef.on('value') 完成，无需手动 render}

function renderDocs() {
  const el = document.getElementById('docList');
  if (!docs.length) {
    el.innerHTML = '<div class="empty">还没有共享信息，在上面发布第一条</div>';
    return;
  }
  el.innerHTML = docs.map(d => `
    <div class="doc" data-id="${d._key}">
      <h3>${esc(d.title)}</h3>
      <div class="body">${esc(d.body)}</div>
      <div class="actions">
        <button class="save" onclick="editDoc('${d._key}')">编辑</button>
        <button class="del"  onclick="delDoc('${d._key}')">删除</button>
      </div>
    </div>
  `).join('');
}

/* ================================================================
 *  HTML 转义工具：防止用户输入的 < > & 破坏页面结构
 * ================================================================ */
function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;'
  }[c]));
}
</script>
</body>
</html>
