<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队知识库 & 任务备忘</title>
<style>
  /* ===== 基础排版 ===== */
  * { box-sizing: border-box; margin: 0; padding:0; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #f6f7fb;
    color: #1a1d2e;
    line-height: 1.6;
    padding: 1.5rem 1rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .sub { color: #6b7185; font-size: 0.85rem; margin-bottom: 1.25rem; }

  /* ===== 顶部标签栏 ===== */
  .tabs {
    display: flex; gap: 0.4rem;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.3rem;
    margin-bottom: 1.25rem;
  }
  .tab {
    flex: 1;
    padding: 0.55rem 0.75rem;
    border: none; background: transparent;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.92rem;
    color: #6b7185;
    cursor: pointer;
    font-weight: 500;
  }
  .tab.active { background: #6366f1; color: #fff; }

  /* ===== 添加表单 ===== */
  .add {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.85rem;
    margin-bottom: 1rem;
  }
  .add input, .add textarea {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.92rem;
    font-family: inherit;
    outline: none;
    margin-bottom: 0.5rem;
  }
  .add input:focus, .add textarea:focus { border-color: #6366f1; }
  .add textarea { resize: vertical; min-height: 80px; }
  .add .meta {
    display: flex; gap: 0.5rem;
    align-items: center; flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }
  .add .meta input { margin: 0; flex: 1; min-width: 120px; }
  .add .btnrow { display: flex; justify-content: flex-end; gap: 0.4rem; }
  .btn {
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.45rem 1rem;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #4f46e5; }
  .btn-ghost { background: transparent; color: #6b7185; border: 1px solid #e5e7eb; }
  .btn-ghost:hover { background: #f3f4f6; color: #1a1d2e; }

  /* ===== 任务条目 ===== */
  .item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    margin-bottom: 0.5rem;
    display: flex; align-items: flex-start; gap: 0.65rem;
  }
  .item.done .t-text { text-decoration: line-through; color: #9ca3af; }
  .item input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #6366f1;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .t-body { flex: 1; }
  .t-text { font-size: 0.95rem; word-break: break-word; }
  .t-meta { font-size: 0.78rem; color: #6b7185; margin-top: 0.2rem; }
  .t-meta .tag {
    background: #eef2ff; color: #4f46e5;
    padding: 0.05rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.35rem;
  }
  .t-actions { display: flex; gap: 0.25rem; }
  .t-actions button {
    background: transparent; border: none;
    color: #9ca3af; cursor: pointer;
    font-size: 1rem; padding: 0 0.2rem;
  }
  .t-actions .del:hover  { color: #ef4444; }
  .t-actions .edit:hover { color: #6366f1; }

  /* ===== 信息共享卡片 ===== */
  .doc {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.7rem;
  }
  .doc h3 {
    font-size: 1rem;
    margin-bottom: 0.45rem;
    color: #1a1d2e;
    word-break: break-word;
  }
  .doc .body {
    font-size: 0.9rem; color: #4b5563;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 0.5rem;
  }
  .doc .actions {
    display: flex; gap: 0.4rem;
    justify-content: flex-end;
    border-top: 1px dashed #e5e7eb;
    padding-top: 0.5rem;
    margin-top: 0.5rem;
  }
  .doc .actions button {
    background: transparent;
    border: 1px solid #e5e7eb;
    border-radius: 5px;
    padding: 0.25rem 0.7rem;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
    color: #6b7185;
  }
  .doc .actions .save:hover { color: #6366f1; border-color: #6366f1; }
  .doc .actions .del:hover  { color: #ef4444; border-color: #ef4444; }

  .empty { text-align: center; color: #9ca3af; padding: 2rem 0; font-size: 0.9rem; }

  /* ===== 右上角连接状态 ===== */
  .status {
    position: fixed;
    top: 0.6rem; right: 0.6rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.72rem;
    background: #fef3c7; color: #92400e;
    border: 1px solid #fde68a;
    z-index: 99;
  }
  .status.online { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
  .status.error { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
</style>
</head>
<body>
  <!-- 右上角实时状态徽标 -->
  <div id="status" class="status">连接中…</div>

  <div class="wrap">
    <h1>团队知识库 & 任务备忘</h1>
    <div class="sub">实时共享：所有访问者看到的内容会自动同步（每 3 秒刷新）</div>

    <div class="tabs">
      <button class="tab active" data-tab="task" onclick="switchTab('task')">📋 任务备忘</button>
      <button class="tab" data-tab="doc"  onclick="switchTab('doc')">📚 信息共享</button>
    </div>

    <!-- 任务面板 -->
    <div id="panel-task">
      <div class="add">
        <div class="meta">
          <input type="text" id="tText" placeholder="任务内容…" onkeydown="if(event.key==='Enter')addTask()">
          <input type="text" id="tWho"  placeholder="负责人（可选）" style="max-width:140px">
        </div>
        <div class="btnrow">
          <button class="btn" onclick="addTask()">+ 添加任务</button>
        </div>
      </div>
      <div id="taskList"></div>
    </div>

    <!-- 信息共享面板 -->
    <div id="panel-doc" style="display:none">
      <div class="add">
        <input type="text" id="dTitle" placeholder="标题，如：实验操作流程">
        <textarea id="dBody" placeholder="详细内容，支持换行…"></textarea>
        <div class="btnrow">
          <button class="btn" onclick="addDoc()">+ 发布信息</button>
        </div>
      </div>
      <div id="docList"></div>
    </div>
  </div>

<script>
/* ================================================================
 *  配置区
 *  ----------------------------------------------------------------
 *  NAMESPACE = 团队命名空间。所有访问者必须使用同一个名字才能共享。
 *  改成你自己团队独特的英文+数字串即可，例如：
 *      const NAMESPACE = 'lab-zhang-2026';
 *      const NAMESPACE = 'team-mycompany-abc';
 *  MantleDB 是免费的免注册 KV 存储，公共命名空间任何人都能读写：
 *      POST https://mantledb.sh/v2/<NAMESPACE>/<path>   ← 写入
 *      GET   https://mantledb.sh/v2/<NAMESPACE>/<path>   ← 读取
 * ================================================================ */
const NAMESPACE     = 'team-knowledge-shared-demo';  // ← 改成你自己的名字
const BASE_URL      = 'https://mantledb.sh/v2/' + NAMESPACE;
const POLL_INTERVAL = 3000;   // 轮询间隔（毫秒）；觉得太频繁可以调到 5000

/* ================================================================
 *  全局状态
 *  ----------------------------------------------------------------
 *  tasks / docs 是当前内存中的数据；
 *  lastTasksTs / lastDocsTs 是上一次同步到的时间戳，用来判断是否需要更新。
 * ================================================================ */
let tasks        = [];
let docs         = [];
let lastTasksTs  = 0;
let lastDocsTs   = 0;

/* ================================================================
 *  工具函数
 * ================================================================ */

// 生成短 id，避免和别人的 id 撞function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// HTML 转义：避免用户输入的 < > & 破坏页面
function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;'
  }[c]));
}

/**
 * 读取一个 entry
 * @returns {Promise<Object|null>} 不存在返回 null；失败返回 null 并打印日志
 */
async function loadEntry(path) {
  try {
    const res = await fetch(BASE_URL + '/' + path, { cache: 'no-store' });
    if (res.status === 404) return null;            // 首次访问，正常情况
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    console.error('读取失败 [' + path + ']：', e);
    return null;
  }
}

/**
 * 写入一个 entry（POST 整体覆盖）
 * 整个任务列表 / 文档列表被打包成一个 JSON 对象写入。
 */
async function saveEntry(path, data) {
  const res = await fetch(BASE_URL + '/' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + ' ' + txt);
  }
  return res.json();
}

/* ================================================================
 *  标签切换
 * ================================================================ */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.getElementById('panel-task').style.display = name === 'task' ? '' : 'none';
  document.getElementById('panel-doc').style.display  = name === 'doc'  ? '' : 'none';
}

/* ================================================================
 *  任务 CRUD *  ----------------------------------------------------------------
 *  每个 async 函数都遵循"乐观更新"模式：
 *    1. 先改本地状态，立即 renderTasks() 让 UI 立刻响应
 *    2. 再异步 await persistTasks() 把整个数组 POST 到云端
 *    3. 失败时只在状态条提示，不回滚 UI（用户重新刷新即可拿到服务器真值）
 * ================================================================ */

async function addTask() {
  const tEl = document.getElementById('tText');
  const wEl = document.getElementById('tWho');
  const text = tEl.value.trim();
  if (!text) return;
  tasks.unshift({
    id:   genId(),
    text,
    who:  wEl.value.trim(),
    done: false,
    ts:   Date.now()
  });
  tEl.value = ''; wEl.value = '';
  renderTasks();
  await persistTasks();
}

async function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  renderTasks();
  await persistTasks();
}

async function delTask(id) {
  if (!confirm('确定删除此任务吗？')) return;
  tasks = tasks.filter(x => x.id !== id);
  renderTasks();
  await persistTasks();
}

async function editTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const nv = prompt('修改任务内容：', t.text);
  if (nv !== null && nv.trim()) {
    t.text = nv.trim();
    t.ts   = Date.now();
    renderTasks();
    await persistTasks();
  }
}

async function persistTasks() {
  const ts = Date.now();
  try {
    await saveEntry('tasks', { items: tasks, ts });
    lastTasksTs = ts;
  } catch (e) {
    showError('任务保存失败：' + e.message);
  }
}

function renderTasks() {
  const el = document.getElementById('taskList');
  if (!tasks.length) {
    el.innerHTML = '<div class="empty">还没有任务，在上面添加一条吧</div>';
    return;
  }
  el.innerHTML = tasks.map(t => `
    <div class="item ${t.done ? 'done' : ''}">
      <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask('${t.id}')">
      <div class="t-body">
        <div class="t-text">${esc(t.text)}</div>
        ${t.who ? `<div class="t-meta"><span class="tag">@${esc(t.who)}</span></div>` : ''}
      </div>
      <div class="t-actions">
        <button class="edit" onclick="editTask('${t.id}')" title="编辑">✎</button>
        <button class="del"  onclick="delTask('${t.id}')"  title="删除">×</button>
      </div>
    </div>
  `).join('');
}

/* ================================================================
 *  信息共享 CRUD
 * ================================================================ */

async function addDoc() {
  const tEl = document.getElementById('dTitle');
  const bEl = document.getElementById('dBody');
  const title = tEl.value.trim();
  const body  = bEl.value.trim();
  if (!title || !body) { alert('请填写标题和内容'); return; }
  docs.unshift({
    id:    genId(),
    title,
    body,
    ts:    Date.now()
  });
  tEl.value = ''; bEl.value = '';
  renderDocs();
  await persistDocs();
}

async function delDoc(id) {
  if (!confirm('确定删除这条信息吗？')) return;
  docs = docs.filter(x => x.id !== id);
  renderDocs();
  await persistDocs();
}

async function editDoc(id) {
  const d = docs.find(x => x.id === id);
  if (!d) return;
  const card = document.querySelector('[data-id="' + id + '"]');
  if (!card) return;
  // 整张卡片替换为可编辑控件
  card.innerHTML = `
    <input type="text" id="ed-t-${id}" value="${esc(d.title)}"
      style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:0.45rem 0.65rem;font-size:0.95rem;font-family:inherit;margin-bottom:0.4rem">
    <textarea id="ed-b-${id}"
      style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:0.45rem 0.65rem;font-size:0.9rem;font-family:inherit;min-height:120px;resize:vertical">${esc(d.body)}</textarea>
    <div class="actions">
      <button class="save" onclick="saveDocEdit('${id}')">保存</button>
      <button class="del"  onclick="renderDocs()">取消</button>
    </div>
  `;
}

async function saveDocEdit(id) {
  const t = document.getElementById('ed-t-' + id).value.trim();
  const b = document.getElementById('ed-b-' + id).value.trim();
  if (!t || !b) { alert('标题和内容不能为空'); return; }
  const d = docs.find(x => x.id === id);
  if (!d) return;
  d.title = t;
  d.body  = b;
  d.ts    = Date.now();
  renderDocs();
  await persistDocs();
}

async function persistDocs() {
  const ts = Date.now();
  try {
    await saveEntry('docs', { items: docs, ts });
    lastDocsTs = ts;
  } catch (e) {
    showError('信息保存失败：' + e.message);
  }
}

function renderDocs() {
  const el = document.getElementById('docList');
  if (!docs.length) {
    el.innerHTML = '<div class="empty">还没有共享信息，在上面发布第一条</div>';
    return;
  }
  el.innerHTML = docs.map(d => `
    <div class="doc" data-id="${d.id}">
      <h3>${esc(d.title)}</h3>
      <div class="body">${esc(d.body)}</div>
      <div class="actions">
        <button class="save" onclick="editDoc('${d.id}')">编辑</button>
        <button class="del"  onclick="delDoc('${d.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

/* ================================================================
 *  轮询同步 —— 让所有人看到的列表保持一致
 *  ----------------------------------------------------------------
 *  每 3 秒拉一次云端数据。如果云端时间戳 ts 比本地新，就用云端数据 *  覆盖本地（这里简化处理：最后写入获胜；小团队完全够用）。
 * ================================================================ */

async function pollOnce() {
  // 同步 tasks
  const tData = await loadEntry('tasks');
  if (tData && tData.ts > lastTasksTs) {
    tasks       = tData.items || [];
    lastTasksTs = tData.ts;
    renderTasks();
  }
  // 同步 docs
  const dData = await loadEntry('docs');
  if (dData && dData.ts > lastDocsTs) {
    docs       = dData.items || [];
    lastDocsTs = dData.ts;
    renderDocs();
  }
}

function startPolling() {
  // 用 setTimeout 递归而不是 setInterval，避免上一次还没结束就开始下一次
  setTimeout(async function tick() {
    try { await pollOnce(); }
    catch (e) { console.error('轮询出错：', e); }
    setTimeout(tick, POLL_INTERVAL);
  }, POLL_INTERVAL);
}

/* ================================================================
 *  错误展示（右上角状态条）
 * ================================================================ */
function showError(msg) {
  const el = document.getElementById('status');
  el.textContent = '⚠ ' + msg;
  el.classList.remove('online');
  el.classList.add('error');
}

/* ================================================================
 *  初始化
 *  ----------------------------------------------------------------
 *  1) 加载 tasks *  2) 加载 docs；首次进入会插入一条示例文档
 *  3) 渲染 UI *  4) 启动轮询
 * ================================================================ */
async function init() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '○ 加载中…';

  // 读取任务列表
  const tData = await loadEntry('tasks');
  if (tData) {
    tasks       = tData.items || [];
    lastTasksTs = tData.ts || 0;
  }

  // 读取文档列表；没有就插入示例
  const dData = await loadEntry('docs');
  if (dData) {
    docs       = dData.items || [];
    lastDocsTs = dData.ts || 0;
  }

  if (!docs.length) {
    docs = [{
      id:    genId(),
      title: '示例：实验操作标准流程',
      body:  '1. 样品前处理\n2. 试剂配制（A:B = 1:3）\n3. 上机测量并记录\n4. 数据归档至共享盘 /lab/yyyy-mm-dd\n\n注意事项：佩戴手套，避免交叉污染。',
      ts:    Date.now()
    }];
    await persistDocs();
  }

  renderTasks();
  renderDocs();

  // 状态：在线
  statusEl.textContent = '● 已同步（每 3 秒自动刷新）';
  statusEl.classList.add('online');
  statusEl.classList.remove('error');

  startPolling();
}

// 启动
init().catch(e => {
  showError('初始化失败：' + e.message);
});
</script>
</body>
</html>
