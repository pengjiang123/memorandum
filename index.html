<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队共享备忘录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #f6f7fb;
    color: #1a1d2e;
    line-height: 1.6;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1a1d2e; }

  .add {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 0.5rem;
  }
  .add input {
    flex: 1;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
  }
  .add input:focus { border-color: #6366f1; }
  .add button {
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1.25rem;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  .add button:hover { background: #4f46e5; }

  .item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .item.done span { text-decoration: line-through; color: #9ca3af; }
  .item input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #6366f1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .item span { flex: 1; font-size: 0.95rem; word-break: break-word; }
  .item .del {
    background: transparent;
    border: none;
    color: #9ca3af;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0 0.25rem;
  }
  .item .del:hover { color: #ef4444; }

  .empty { text-align: center; color: #9ca3af; padding: 2rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>团队备忘录</h1>

  <div class="add">
    <input type="text" id="input" placeholder="输入一条备忘，回车保存…" onkeydown="if(event.key==='Enter')add()">
    <button onclick="add()">添加</button>
  </div>

  <div id="list"></div>
</div>

<script>
const KEY = 'simple-team-memo';
let items = [];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    items = raw ? JSON.parse(raw) : [];
  } catch (e) { items = []; }
  render();
}
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

function add() {
  const el = document.getElementById('input');
  const text = el.value.trim();
  if (!text) return;
  items.unshift({ text, done: false });
  el.value = '';
  save();
  render();
}

function toggle(i) {
  items[i].done = !items[i].done;
  save();
  render();
}

function del(i) {
  items.splice(i, 1);
  save();
  render();
}

function render() {
  const el = document.getElementById('list');
  if (!items.length) {
    el.innerHTML = '<div class="empty">还没有备忘，在上面输入一条吧</div>';
    return;
  }
  el.innerHTML = items.map((m, i) => `
    <div class="item ${m.done ? 'done' : ''}">
      <input type="checkbox" ${m.done ? 'checked' : ''} onclick="toggle(${i})">
      <span>${m.text.replace(/</g, '&lt;')}</span>
      <button class="del" onclick="del(${i})" title="删除">×</button>
    </div>
  `).join('');
}

load();
</script>
</body>
</html>
