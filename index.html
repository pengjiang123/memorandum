<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">备</div>
      <div class="brand-text">
        <h1>团队共享备忘录</h1>
        <p>实时同步 · 多人协作 · 永久保存</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="online-dot">5 人在线</span>
      <div class="team-avatars">
        <div class="avatar v1">L</div>
        <div class="avatar v2">M</div>
        <div class="avatar v3">Y</div>
        <div class="avatar v4">Z</div>
        <div class="avatar v5">C</div>
      </div>
      <button class="btn btn-primary" onclick="openEditor()">+ 新建备忘</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索标题、内容或标签…" oninput="render()">
    </div>
    <div class="filter-tabs" id="filterTabs"></div>
    <button class="btn btn-ghost" onclick="exportData()" title="导出数据">导出</button>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <h3>本周统计</h3>
        <div class="stat-grid">
          <div class="stat">
            <div class="num" id="statTotal">0</div>
            <div class="lbl">总备忘</div>
          </div>
          <div class="stat">
            <div class="num" id="statDone">0</div>
            <div class="lbl">已完成</div>
          </div>
          <div class="stat">
            <div class="num" id="statToday">0</div>
            <div class="lbl">今日新增</div>
          </div>
          <div class="stat">
            <div class="num" id="statPinned">0</div>
            <div class="lbl">置顶项</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>分类</h3>
        <ul class="category-list" id="categoryList"></ul>
      </div>

      <div class="panel">
        <h3>最近动态</h3>
        <div id="activityList"></div>
      </div>
    </aside>

    <main class="memo-area">
      <div class="memo-section">
        <h2>📌 置顶备忘 <span class="badge" id="pinBadge">0</span></h2>
        <div class="memo-grid" id="pinGrid"></div>
      </div>

      <div class="memo-section">
        <h2>📋 全部备忘 <span class="badge" id="allBadge">0</span></h2>
        <div class="memo-grid" id="memoGrid"></div>
      </div>
    </main>
  </div>

</div>

<!-- Editor Modal -->
<div class="modal-mask" id="editorMask">
  <div class="modal">
    <h3 id="editorTitle">新建备忘</h3>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div>
        <label>分类</label>
        <select id="editCategory">
          <option value="work">📊 工作</option>
          <option value="meeting">🤝 会议</option>
          <option value="idea">💡 想法</option>
          <option value="todo">✅ 待办</option>
          <option value="announce">📢 公告</option>
          <option value="learn">📚 学习</option>
        </select>
      </div>
      <div>
        <label>作者</label>
        <select id="editAuthor">
          <option value="L">林同学</option>
          <option value="M">美工组</option>
          <option value="Y">研发-Y</option>
          <option value="Z">张总</option>
          <option value="C">产品-C</option>
        </select>
      </div>
    </div>
    <label>标题</label>
    <input type="text" id="editTitle" placeholder="简明扼要的标题…">
    <label>内容</label>
    <textarea id="editContent" rows="4" placeholder="备忘内容、要点或备注…"></textarea>
    <label>勾选清单（每行一项，逗号分隔勾选状态，如：标题,false）</label>
    <textarea id="editChecklist" rows="3" placeholder="准备周报材料&#10;提交接口文档&#10;Review PR,true"></textarea>
    <label>标签（逗号分隔）</label>
    <input type="text" id="editTags" placeholder="Q3, 紧急, 客户">
    <div class="form-row" style="margin-top:0.85rem">
      <div>
        <label>置顶</label>
        <select id="editPinned">
          <option value="false">普通</option>
          <option value="true">置顶</option>
        </select>
      </div>
      <div>
        <label>截止日期</label>
        <input type="text" id="editDue" placeholder="如：2026-08-25">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEditor()">取消</button>
      <button class="btn btn-primary" onclick="saveMemo()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== Data Layer ===== */
const CATEGORIES = {
  work:     { name: '工作',     color: '#6366f1', dot: 'var(--accent)' },
  meeting:  { name: '会议',     color: '#ec4899', dot: 'var(--accent2)' },
  idea:     { name: '想法',     color: '#10b981', dot: 'var(--accent3)' },
  todo:     { name: '待办',     color: '#f59e0b', dot: 'var(--accent4)' },
  announce: { name: '公告',     color: '#8b5cf6', dot: 'var(--accent5)' },
  learn:    { name: '学习',     color: '#06b6d4', dot: '#06b6d4' }
};

const TEAM = {
  L: { name: '林同学',  cls: 'v1' },
  M: { name: '美工组',  cls: 'v2' },
  Y: { name: '研发-Y',  cls: 'v3' },
  Z: { name: '张总',    cls: 'v4' },
  C: { name: '产品-C',  cls: 'v5' }
};

const SAMPLE_MEMOS = [
  {
    id: 'm1',
    category: 'announce',
    title: '本周五全员团建通知',
    content: '本周五下午 2 点出发前往云栖山庄集合，行政已预定大巴与晚餐。请各位提前在群里确认是否参加。',
    author: 'Z',
    tags: ['团建', '行政'],
    pinned: true,
    due: '2026-08-22',
    checklist: [
      { text: '确认参加人员名单', done: true },
      { text: '预定晚餐与包车', done: true },
      { text: '通知全体同事', done: false }
    ],
    createdAt: '2026-08-15T09:00:00'
  },
  {
    id: 'm2',
    category: 'meeting',
    title: 'Q3 产品评审会议要点',
    content: '本次评审聚焦新版本的核心功能演示与下季度路线图。研发与设计需在会前提交本迭代 Demo。',
    author: 'C',
    tags: ['Q3', '产品'],
    pinned: true,
    due: '2026-08-20',
    checklist: [
      { text: '准备功能 Demo 录屏', done: false },
      { text: '汇总竞品分析', done: false },
      { text: '整理 Roadmap', done: true }
    ],
    createdAt: '2026-08-17T14:30:00'
  },
  {
    id: 'm3',
    category: 'work',
    title: '接口联调问题跟进',
    content: '用户中心的 OAuth 回调偶发 502，需与运维排查网关超时配置。当前已临时启用重试机制。',
    author: 'Y',
    tags: ['紧急', '后端'],
    pinned: false,
    due: '2026-08-19',
    checklist: [
      { text: '复现并记录 502 链路日志', done: true },
      { text: '与运维同步网关配置', done: false }
    ],
    createdAt: '2026-08-18T10:15:00'
  },
  {
    id: 'm4',
    category: 'idea',
    title: '把客户反馈做成每月一图',
    content: '把分散在工单、社群、回访里的客户声音做成一张月度情绪地图，能让团队直观感受体验变化趋势。',
    author: 'C',
    tags: ['体验', '数据可视化'],
    pinned: false,
    due: '',
    checklist: [],
    createdAt: '2026-08-18T11:40:00'
  },
  {
    id: 'm5',
    category: 'todo',
    title: '官网首页改版素材清单',
    content: 'Banner 主视觉、价值主张文案、合作伙伴 LOGO、案例视频缩略图共 8 项。优先级：主视觉 > 视频 > LOGO。',
    author: 'M',
    tags: ['官网', '改版'],
    pinned: false,
    due: '2026-08-25',
    checklist: [
      { text: '主视觉 2 套', done: false },
      { text: '价值主张文案', done: true },
      { text: 'LOGO 矢量文件', done: false }
    ],
    createdAt: '2026-08-16T16:20:00'
  },
  {
    id: 'm6',
    category: 'learn',
    title: '本周技术分享：Rust 异步运行时',
    content: '分享人：研发-Y。议题：Tokio 的多线程调度、MPSC 通道、内部任务队列。会议室 B，预计 45 分钟。',
    author: 'Y',
    tags: ['技术分享', 'Rust'],
    pinned: false,
    due: '2026-08-21',
    checklist: [],
    createdAt: '2026-08-17T20:00:00'
  },
  {
    id: 'm7',
    category: 'work',
    title: '客户验收问题汇总',
    content: '本周新增 3 个 A 类问题，均已分配到人。建议每日站会同步处理进度，避免延期。',
    author: 'L',
    tags: ['客户', '跟进'],
    pinned: false,
    due: '2026-08-23',
    checklist: [
      { text: 'P1: 数据导出格式问题', done: true },
      { text: 'P2: 权限边界不清晰', done: false },
      { text: 'P3: 报表导出失败', done: false }
    ],
    createdAt: '2026-08-18T09:00:00'
  }
];

let state = {
  memos: [],
  filter: 'all',
  search: '',
  category: 'all'
};

function load() {
  try {
    const raw = localStorage.getItem('team-memo-v1');
    if (raw) {
      state.memos = JSON.parse(raw);
    } else {
      state.memos = JSON.parse(JSON.stringify(SAMPLE_MEMOS));
      persist();
    }
  } catch (e) {
    state.memos = JSON.parse(JSON.stringify(SAMPLE_MEMOS));
  }
}

function persist() {
  localStorage.setItem('team-memo-v1', JSON.stringify(state.memos));
}

/* ===== Helpers ===== */
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date('2026-08-18T12:00:00');
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  if (diff < 86400*3) return Math.floor(diff/86400) + ' 天前';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function isToday(iso) {
  const d = new Date(iso);
  const now = new Date('2026-08-18T12:00:00');
  return d.toDateString() === now.toDateString();
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===== Rendering ===== */
function matchesFilter(m) {
  const q = state.search.trim().toLowerCase();
  if (q) {
    const hay = (m.title + ' ' + m.content + ' ' + (m.tags||[]).join(' ') + ' ' + (m.checklist||[]).map(c=>c.text).join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (state.category !== 'all' && m.category !== state.category) return false;
  if (state.filter === 'pin' && !m.pinned) return false;
  if (state.filter === 'todo') {
    const has = (m.checklist||[]).some(c => !c.done);
    if (!has) return false;
  }
  if (state.filter === 'mine') {
    if (m.author !== 'Z') return false; /* demo: 当前用户为张总 */
  }
  return true;
}

function renderFilterTabs() {
  const counts = {
    all: state.memos.length,
    pin: state.memos.filter(m => m.pinned).length,
    todo: state.memos.filter(m => (m.checklist||[]).some(c => !c.done)).length,
    mine: state.memos.filter(m => m.author === 'Z').length
  };
  const items = [
    { key: 'all', label: '全部', count: counts.all },
    { key: 'pin', label: '⭐ 置顶', count: counts.pin },
    { key: 'todo', label: '☑ 待办', count: counts.todo },
    { key: 'mine', label: '👤 我创建的', count: counts.mine }
  ];
  document.getElementById('filterTabs').innerHTML = items.map(i =>
    `<button class="filter-tab ${state.filter===i.key?'active':''}" onclick="setFilter('${i.key}')">${i.label}<span class="count">${i.count}</span></button>`
  ).join('');
}

function renderCategories() {
  const all = state.memos.length;
  const items = [{ key: 'all', name: '全部备忘', color: 'linear-gradient(135deg, var(--accent), var(--accent2))' }];
  Object.keys(CATEGORIES).forEach(k => {
    items.push({ key: k, name: CATEGORIES[k].name, color: CATEGORIES[k].color });
  });
  const counts = { all };
  state.memos.forEach(m => { counts[m.category] = (counts[m.category]||0) + 1; });

  document.getElementById('categoryList').innerHTML = items.map(i =>
    `<li class="category-item ${state.category===i.key?'active':''}" onclick="setCategory('${i.key}')">
      <span class="left">
        <span class="category-dot" style="background:${i.color}"></span>${i.name}
      </span>
      <span class="category-count">${counts[i.key]||0}</span>
    </li>`
  ).join('');
}

function renderStats() {
  document.getElementById('statTotal').textContent = state.memos.length;
  document.getElementById('statDone').textContent = state.memos.reduce((a, m) => a + (m.checklist||[]).filter(c => c.done).length, 0);
  document.getElementById('statToday').textContent = state.memos.filter(m => isToday(m.createdAt)).length;
  document.getElementById('statPinned').textContent = state.memos.filter(m => m.pinned).length;
}

function renderActivity() {
  const recent = [...state.memos].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
  document.getElementById('activityList').innerHTML = recent.map(m => {
    const t = TEAM[m.author];
    return `<div class="activity-item">
      <div class="activity-avatar ${t.cls}">${m.author}</div>
      <div class="activity-text">
        <strong>${t.name}</strong> 添加了备忘《${escapeHtml(m.title)}》
        <div class="activity-time">${fmtDate(m.createdAt)} · ${CATEGORIES[m.category].name}</div>
      </div>
    </div>`;
  }).join('');
}

function memoCardHTML(m) {
  const cat = CATEGORIES[m.category];
  const t = TEAM[m.author];
  const pin = m.pinned ? '<div class="memo-pin" title="已置顶">📌</div>' : '';
  const due = m.due ? `<span style="color:var(--accent4);font-weight:600">⏰ ${m.due}</span>` : '';
  const tags = (m.tags||[]).slice(0,3).map(tg => `<span class="memo-tag" style="background:${cat.color}1a;color:${cat.color}"><span class="dot" style="background:${cat.color}"></span>${escapeHtml(tg)}</span>`).join('');
  const checklist = (m.checklist && m.checklist.length) ? `
    <div class="memo-checklist">
      ${m.checklist.map((c,i) => `
        <div class="check-item ${c.done?'done':''}">
          <input type="checkbox" ${c.done?'checked':''} onclick="event.stopPropagation();toggleCheck('${m.id}',${i})">
          <span>${escapeHtml(c.text)}</span>
        </div>`).join('')}
    </div>` : '';
  return `<div class="memo-card" onclick="openEditor('${m.id}')">
    ${pin}
    ${tags ? `<div style="display:flex;gap:0.35rem;flex-wrap:wrap">${tags}</div>` : `<div class="memo-tag" style="background:${cat.color}1a;color:${cat.color}"><span class="dot" style="background:${cat.color}"></span>${cat.name}</div>`}
    <div class="memo-title">${escapeHtml(m.title)}</div>
    <div class="memo-content">${escapeHtml(m.content)}</div>
    ${checklist}
    <div class="memo-footer">
      <div class="memo-author">
        <div class="av ${t.cls}">${m.author}</div>
        <span>${t.name}</span>
      </div>
      <div class="memo-actions">
        ${due}
        <button class="memo-action" onclick="event.stopPropagation();togglePin('${m.id}')" title="置顶">${m.pinned?'取消置顶':'置顶'}</button>
        <button class="memo-action danger" onclick="event.stopPropagation();deleteMemo('${m.id}')" title="删除">删除</button>
      </div>
    </div>
  </div>`;
}

function render() {
  state.search = document.getElementById('searchInput').value;
  renderFilterTabs();
  renderCategories();
  renderStats();
  renderActivity();

  const visible = state.memos.filter(matchesFilter);
  const pinned = visible.filter(m => m.pinned);
  const others = visible.filter(m => !m.pinned);

  document.getElementById('pinBadge').textContent = pinned.length;
  document.getElementById('allBadge').textContent = visible.length;

  document.getElementById('pinGrid').innerHTML = pinned.length
    ? pinned.map(memoCardHTML).join('')
    : '<div class="empty-state" style="grid-column:1/-1"><div class="ico">📌</div><div>暂无置顶备忘</div></div>';

  document.getElementById('memoGrid').innerHTML = others.length
    ? others.map(memoCardHTML).join('')
    : `<div class="empty-state" style="grid-column:1/-1">
         <div class="ico">📝</div>
         <div>${state.search || state.category!=='all' || state.filter!=='all' ? '没有符合条件的备忘' : '还没有备忘，点击右上角"新建备忘"开始记录'}</div>
       </div>`;
}

/* ===== Actions ===== */
function setFilter(k) { state.filter = k; render(); }
function setCategory(k) { state.category = k; render(); }

function togglePin(id) {
  const m = state.memos.find(x => x.id === id);
  if (!m) return;
  m.pinned = !m.pinned;
  persist();
  render();
  showToast(m.pinned ? '已置顶' : '已取消置顶');
}

function toggleCheck(id, idx) {
  const m = state.memos.find(x => x.id === id);
  if (!m || !m.checklist[idx]) return;
  m.checklist[idx].done = !m.checklist[idx].done;
  persist();
  render();
}

function deleteMemo(id) {
  const m = state.memos.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`确认删除备忘《${m.title}》吗？`)) return;
  state.memos = state.memos.filter(x => x.id !== id);
  persist();
  render();
  showToast('备忘已删除');
}

function openEditor(id) {
  document.getElementById('editorMask').classList.add('show');
  if (id) {
    const m = state.memos.find(x => x.id === id);
    document.getElementById('editorTitle').textContent = '编辑备忘';
    document.getElementById('editId').value = id;
    document.getElementById('editCategory').value = m.category;
    document.getElementById('editAuthor').value = m.author;
    document.getElementById('editTitle').value = m.title;
    document.getElementById('editContent').value = m.content;
    document.getElementById('editChecklist').value = (m.checklist||[]).map(c => c.text + ',' + c.done).join('\n');
    document.getElementById('editTags').value = (m.tags||[]).join(', ');
    document.getElementById('editPinned').value = String(!!m.pinned);
    document.getElementById('editDue').value = m.due || '';
  } else {
    document.getElementById('editorTitle').textContent = '新建备忘';
    document.getElementById('editId').value = '';
    document.getElementById('editCategory').value = 'work';
    document.getElementById('editAuthor').value = 'Z';
    document.getElementById('editTitle').value = '';
    document.getElementById('editContent').value = '';
    document.getElementById('editChecklist').value = '';
    document.getElementById('editTags').value = '';
    document.getElementById('editPinned').value = 'false';
    document.getElementById('editDue').value = '';
  }
}

function closeEditor() {
  document.getElementById('editorMask').classList.remove('show');
}

function saveMemo() {
  const id = document.getElementById('editId').value;
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value.trim();
  if (!title) { showToast('请输入标题'); return; }

  const checklistRaw = document.getElementById('editChecklist').value.trim();
  const checklist = checklistRaw
    ? checklistRaw.split(/\n+/).map(line => {
        const [text, done] = line.split(',').map(s => s.trim());
        return { text: text || '', done: done === 'true' || done === '1' };
      }).filter(c => c.text)
    : [];

  const tagsRaw = document.getElementById('editTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];

  const data = {
    category: document.getElementById('editCategory').value,
    author:   document.getElementById('editAuthor').value,
    title,
    content,
    checklist,
    tags,
    pinned: document.getElementById('editPinned').value === 'true',
    due: document.getElementById('editDue').value.trim(),
  };

  if (id) {
    const m = state.memos.find(x => x.id === id);
    Object.assign(m, data);
    showToast('已更新');
  } else {
    state.memos.unshift({
      ...data,
      id: 'm' + Date.now(),
      createdAt: new Date().toISOString()
    });
    showToast('已创建');
  }
  persist();
  closeEditor();
  render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(state.memos, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'team-memo-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 JSON');
}

document.getElementById('editorMask').addEventListener('click', (e) => {
  if (e.target.id === 'editorMask') closeEditor();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeEditor();
});

/* ===== Init ===== */
load();
render();
</script>
</body>
</html>
