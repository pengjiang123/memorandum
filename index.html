<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队实时备忘录 (Supabase)</title>
<!-- Supabase JS SDK，来自官方 CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #f6f7fb;
    color: #1a1d2e;
    line-height: 1.6;
    padding: 1.5rem 1rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .sub { color: #6b7185; font-size: 0.85rem; margin-bottom: 1rem; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #e5e7eb;
    margin-bottom: 1rem;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f59e0b;
  }
  .status.ok .dot { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
  .status.bad .dot { background: #ef4444; }

  .tabs {
    display: flex;
    gap: 0.4rem;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.3rem;
    margin-bottom: 1.25rem;
  }
  .tab {
    flex: 1;
    padding: 0.55rem 0.75rem;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.92rem;
    color: #6b7185;
    cursor: pointer;
    font-weight: 500;
  }
  .tab.active { background: #6366f1; color: #fff; }

  .add {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.85rem;
    margin-bottom: 1rem;
  }
  .add input, .add textarea {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.92rem;
    font-family: inherit;
    outline: none;
    margin-bottom: 0.5rem;
  }
  .add input:focus, .add textarea:focus { border-color: #6366f1; }
  .add textarea { resize: vertical; min-height: 80px; }
  .add .meta {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }
  .add .meta input { margin: 0; flex: 1; min-width: 120px; }
  .add .btnrow { display: flex; justify-content: flex-end; gap: 0.4rem; }
  .btn {
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.45rem 1rem;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #4f46e5; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
  }
  .item.done .t-text { text-decoration: line-through; color: #9ca3af; }
  .item input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #6366f1;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .t-body { flex: 1; }
  .t-text { font-size: 0.95rem; word-break: break-word; }
  .t-meta { font-size: 0.78rem; color: #6b7185; margin-top: 0.2rem; }
  .t-meta .tag {
    background: #eef2ff;
    color: #4f46e5;
    padding: 0.05rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.35rem;
  }
  .t-actions { display: flex; gap: 0.25rem; }
  .t-actions button {
    background: transparent;
    border: none;
    color: #9ca3af;
    cursor: pointer;
    font-size: 1rem;
    padding: 0 0.2rem;
  }
  .t-actions .del:hover { color: #ef4444; }
  .t-actions .edit:hover { color: #6366f1; }

  .doc {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.7rem;
  }
  .doc h3 {
    font-size: 1rem;
    margin-bottom: 0.45rem;
    color: #1a1d2e;
    word-break: break-word;
  }
  .doc .body {
    font-size: 0.9rem;
    color: #4b5563;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 0.5rem;
  }
  .doc .actions {
    display: flex;
    gap: 0.4rem;
    justify-content: flex-end;
    border-top: 1px dashed #e5e7eb;
    padding-top: 0.5rem;
    margin-top: 0.5rem;
  }
  .doc .actions button {
    background: transparent;
    border: 1px solid #e5e7eb;
    border-radius: 5px;
    padding: 0.25rem 0.7rem;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
    color: #6b7185;
  }
  .doc .actions .save:hover { color: #6366f1; border-color: #6366f1; }
  .doc .actions .del:hover { color: #ef4444; border-color: #ef4444; }

  .empty { text-align: center; color: #9ca3af; padding: 2rem 0; font-size: 0.9rem; }

  /* 编辑输入框样式（用于 docs 内联编辑） */
  .doc input.doc-input, .doc textarea.doc-input {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 0.45rem 0.65rem;
    font-family: inherit;
    outline: none;
    margin-bottom: 0.4rem;
    background: #fff;
  }
  .doc input.doc-input { font-size: 0.95rem; }
  .doc textarea.doc-input { font-size: 0.9rem; min-height: 120px; resize: vertical; }
</style>
</head>
<body>
<div class="wrap">
  <h1>团队实时备忘录</h1>
  <div class="sub">所有成员的修改会实时推送给其他人（基于 Supabase Realtime）</div>

  <div id="status" class="status"><span class="dot"></span><span id="statusText">正在连接…</span></div>

  <div class="tabs">
    <button class="tab active" data-tab="task" onclick="switchTab('task')">📋 任务备忘</button>
    <button class="tab" data-tab="doc" onclick="switchTab('doc')">📚 信息共享</button>
  </div>

  <!-- TASK PANEL -->
  <div id="panel-task">
    <div class="add">
      <div class="meta">
        <input type="text" id="tText" placeholder="任务内容…" onkeydown="if(event.key==='Enter')addTask()">
        <input type="text" id="tWho" placeholder="负责人（可选）" style="max-width:140px">
      </div>
      <div class="btnrow">
        <button class="btn" id="btnAddTask" onclick="addTask()">+ 添加任务</button>
      </div>
    </div>
    <div id="taskList"></div>
  </div>

  <!-- DOC PANEL -->
  <div id="panel-doc" style="display:none">
    <div class="add">
      <input type="text" id="dTitle" placeholder="标题，如：实验操作流程">
      <textarea id="dBody" placeholder="详细内容，支持换行…"></textarea>
      <div class="btnrow">
        <button class="btn" id="btnAddDoc" onclick="addDoc()">+ 发布信息</button>
      </div>
    </div>
    <div id="docList"></div>
  </div>
</div>

<script>
/* ====== Supabase 项目配置 ====== */
const SUPABASE_URL      = 'https://xxwhmscpiozlhicerunj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Zm1s02Tpb2AZ5hf39xlBQQ_NtH__t9x';
/* ================================ */

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let tasks = [];
let docs  = [];

/* ---------- 状态指示 ---------- */
function setStatus(state, msg) {
  const el = document.getElementById('status');
  el.classList.remove('ok','bad');
  if (state === 'ok')  el.classList.add('ok');
  if (state === 'bad') el.classList.add('bad');
  document.getElementById('statusText').textContent = msg;
}

/* ---------- tabs ---------- */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('panel-task').style.display = name === 'task' ? '' : 'none';
  document.getElementById('panel-doc').style.display  = name === 'doc'  ? '' : 'none';
}

/* ---------- helpers ---------- */
function esc(s){ return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function sortByTsDesc(a, b) { return (b.ts||0) - (a.ts||0); }
function sortByTsAsc(a, b)  { return (a.ts||0) - (b.ts||0); }

/* ---------- 渲染 ---------- */
function renderTasks() {
  const el = document.getElementById('taskList');
  if (!tasks.length) { el.innerHTML = '<div class="empty">还没有任务，在上面添加一条吧</div>'; return; }
  // 按未完成优先 + 时间倒序
  const sorted = [...tasks].sort((a,b) => (a.done===b.done) ? sortByTsDesc(a,b) : (a.done?1:-1));
  el.innerHTML = sorted.map(t => {
    // 反查索引（基于未排序数组）
    const i = tasks.findIndex(x => x.id === t.id);
    return `
    <div class="item ${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} onclick="toggleTask('${t.id}', ${t.done})">
      <div class="t-body">
        <div class="t-text">${esc(t.text)}</div>
        ${t.who ? `<div class="t-meta"><span class="tag">@${esc(t.who)}</span></div>` : ''}
      </div>
      <div class="t-actions">
        <button class="edit" onclick="editTask('${t.id}')" title="编辑">✎</button>
        <button class="del" onclick="delTask('${t.id}')" title="删除">×</button>
      </div>
    </div>`;
  }).join('');
}

function renderDocs() {
  const el = document.getElementById('docList');
  if (!docs.length) { el.innerHTML = '<div class="empty">还没有共享信息，在上面发布第一条</div>'; return; }
  const sorted = [...docs].sort(sortByTsDesc);
  el.innerHTML = sorted.map(d => `
    <div class="doc" data-id="${d.id}">
      <h3>${esc(d.title)}</h3>
      <div class="body">${esc(d.body)}</div>
      <div class="actions">
        <button class="save" onclick="editDoc('${d.id}')">编辑</button>
        <button class="del" onclick="delDoc('${d.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

/* ---------- 任务操作 ---------- */
async function addTask() {
  const t = document.getElementById('tText').value.trim();
  const w = document.getElementById('tWho').value.trim();
  if (!t) return;
  document.getElementById('btnAddTask').disabled = true;
  const { error } = await client.from('tasks').insert({
    id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    text: t, who: w, done: false, ts: Date.now()
  });
  document.getElementById('btnAddTask').disabled = false;
  if (error) { alert('保存失败：' + error.message); return; }
  document.getElementById('tText').value = '';
  document.getElementById('tWho').value = '';
}

async function toggleTask(id, currentDone) {
  await client.from('tasks').update({ done: !currentDone, ts: Date.now() }).eq('id', id);
}

async function delTask(id) {
  if (!confirm('删除这条任务吗？')) return;
  await client.from('tasks').delete().eq('id', id);
}

async function editTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const nv = prompt('修改任务内容：', t.text);
  if (nv === null) return;
  const v = nv.trim();
  if (!v) return;
  await client.from('tasks').update({ text: v, ts: Date.now() }).eq('id', id);
}

/* ---------- 信息共享操作 ---------- */
async function addDoc() {
  const title = document.getElementById('dTitle').value.trim();
  const body  = document.getElementById('dBody').value.trim();
  if (!title || !body) { alert('请填写标题和内容'); return; }
  document.getElementById('btnAddDoc').disabled = true;
  const { error } = await client.from('docs').insert({
    id: 'd_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    title, body, ts: Date.now()
  });
  document.getElementById('btnAddDoc').disabled = false;
  if (error) { alert('保存失败：' + error.message); return; }
  document.getElementById('dTitle').value = '';
  document.getElementById('dBody').value = '';
}

async function delDoc(id) {
  if (!confirm('删除这条信息吗？')) return;
  await client.from('docs').delete().eq('id', id);
}

function editDoc(id) {
  const d = docs.find(x => x.id === id);
  if (!d) return;
  const card = document.querySelector('[data-id="' + id + '"]');
  card.innerHTML = `
    <input class="doc-input" id="ed-t-${id}" value="${esc(d.title)}">
    <textarea class="doc-input" id="ed-b-${id}">${esc(d.body)}</textarea>
    <div class="actions">
      <button class="save" onclick="saveDoc('${id}')">保存</button>
      <button class="del" onclick="renderDocs()">取消</button>
    </div>
  `;
}

async function saveDoc(id) {
  const t = document.getElementById('ed-t-' + id).value.trim();
  const b = document.getElementById('ed-b-' + id).value.trim();
  if (!t || !b) { alert('标题和内容不能为空'); return; }
  const { error } = await client.from('docs').update({ title: t, body: b, ts: Date.now() }).eq('id', id);
  if (error) { alert('保存失败：' + error.message); }
}

/* ---------- 初始加载 ---------- */
async function loadAll() {
  const [t1, t2] = await Promise.all([
    client.from('tasks').select('*'),
    client.from('docs').select('*')
  ]);
  if (t1.error || t2.error) {
    setStatus('bad', '加载失败：' + (t1.error?.message || t2.error?.message));
    return;
  }
  tasks = t1.data || [];
  docs  = t2.data || [];
  renderTasks();
  renderDocs();
}

/* ---------- 实时订阅 ---------- */
function subscribe() {
  client
    .channel('public:tasks')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, payload => {
      const row = payload.new || payload.old;
      if (!row) return;
      if (payload.eventType === 'INSERT') {
        if (!tasks.some(t => t.id === row.id)) tasks.push(row);
      } else if (payload.eventType === 'UPDATE') {
        const i = tasks.findIndex(t => t.id === row.id);
        if (i >= 0) tasks[i] = row; else tasks.push(row);
      } else if (payload.eventType === 'DELETE') {
        tasks = tasks.filter(t => t.id !== (payload.old && payload.old.id));
      }
      renderTasks();
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') setStatus('ok', '已连接 · 实时同步中');
      else if (status === 'CHANNEL_ERROR' || status === 'CLOSED') setStatus('bad', '连接断开，正在重试…');
    });

  client
    .channel('public:docs')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, payload => {
      const row = payload.new || payload.old;
      if (!row) return;
      if (payload.eventType === 'INSERT') {
        if (!docs.some(d => d.id === row.id)) docs.push(row);
      } else if (payload.eventType === 'UPDATE') {
        const i = docs.findIndex(d => d.id === row.id);
        if (i >= 0) docs[i] = row; else docs.push(row);
      } else if (payload.eventType === 'DELETE') {
        docs = docs.filter(d => d.id !== (payload.old && payload.old.id));
      }
      renderDocs();
    })
    .subscribe();
}

/* ---------- 启动 ---------- */
(async function init() {
  try {
    await loadAll();
    subscribe();
  } catch (e) {
    setStatus('bad', '初始化失败：' + e.message);
  }
})();
</script>
</body>
</html>
